<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tu reserva · Hotel Portal Norte 170</title>
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0E2A42">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,500;0,8..60,600;1,8..60,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/assets/styles.css">
<style>
/* Página del huésped: confirmación + check-in en línea. Pensada primero para celular. */
body.guest{padding:0;background:var(--bg)}
.gbar{background:var(--navy);color:#fff;border-bottom:4px solid var(--accent)}
.gbar .in{max-width:760px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;gap:12px}
.gbar .mk{width:46px;height:46px;border-radius:50%;background:var(--cream);display:grid;place-items:center;flex:none}
.gbar .mk img{width:34px;height:34px}
.gbar b{font-family:var(--display);font-size:1.15rem;font-weight:600;display:block;line-height:1.1}
.gbar small{font-size:.66rem;letter-spacing:.12em;color:#E7C9A9;font-weight:600}
.gwrap{max-width:760px;margin:0 auto;padding:20px 16px 64px;display:flex;flex-direction:column;gap:18px}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.gcard .ph{aspect-ratio:16/7;background:var(--sunk);overflow:hidden}
.gcard .ph img{width:100%;height:100%;object-fit:cover;display:block}
.gcard .bd{padding:18px;display:flex;flex-direction:column;gap:14px}
.gh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.gh h1{font-size:1.6rem;line-height:1.15}
.code{font-family:var(--mono);font-size:.82rem;color:var(--muted)}
.dates{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;background:var(--sunk);border-radius:12px;padding:12px 14px}
.dates .k{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.dates .v{font-family:var(--display);font-size:1.15rem;font-weight:600;line-height:1.2}
.dates .t{font-size:.8rem;color:var(--muted)}
.dates .n{text-align:center;font-size:.78rem;color:var(--muted);border-inline:1px solid var(--line);padding-inline:12px}
.dates .n b{display:block;font-size:1.3rem;color:var(--fg);font-family:var(--mono)}
.kvs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 16px}
.kvs div{display:flex;flex-direction:column}
.kvs span{font-size:.72rem;color:var(--muted)} .kvs b{font-weight:600}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.acts .btn{flex:1 1 160px}
.sec-h{display:flex;align-items:baseline;gap:10px;justify-content:space-between;flex-wrap:wrap}
.sec-h h2{font-size:1.35rem}
.steps{display:flex;gap:6px;flex-wrap:wrap;font-size:.76rem;color:var(--muted)}
.steps span{background:var(--sunk);border-radius:99px;padding:3px 10px}
.person{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--surface)}
.person .ph-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.person h3{font-size:1.05rem}
.tag{font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.shots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.shot{position:relative;border:1.5px dashed var(--line);border-radius:12px;background:var(--sunk);aspect-ratio:3/4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:8px;cursor:pointer;overflow:hidden;color:var(--muted);font-size:.76rem;font-weight:600}
.shot.doc{aspect-ratio:4/3}
.shot input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shot .st{position:absolute;left:6px;right:6px;bottom:6px;background:rgba(14,42,66,.82);color:#fff;border-radius:8px;font-size:.7rem;padding:3px 6px;z-index:2}
.shot.ok{border-style:solid;border-color:var(--ok)} .shot.ok .st{background:rgba(62,122,31,.9)}
.shot.err{border-color:var(--bad)} .shot.err .st{background:var(--bad)}
.shot .ic{font-size:1.5rem;line-height:1}
.shot .tin{display:contents}
.shot .req{font-weight:400;font-size:.68rem}
.done{display:flex;gap:12px;align-items:flex-start;background:var(--ok-soft);color:var(--ok);border-radius:14px;padding:16px}
.done b{display:block;font-size:1.05rem;color:var(--ok)}
.done p{margin:.2em 0 0;color:var(--fg)}
.sticky-go{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:18px 0 6px;display:flex;flex-direction:column;gap:8px}
.foot-g{font-size:.78rem;color:var(--muted);text-align:center}
.wifi{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;background:var(--sunk);border-radius:12px;padding:12px 14px;font-size:.88rem}
.wifi b{width:100%}
.big-state{padding:48px 16px;text-align:center;color:var(--muted)}
@media (max-width:560px){
  .gh h1{font-size:1.35rem}
  .shots{grid-template-columns:repeat(2,minmax(0,1fr))}
  .shot.back{grid-column:1/-1;aspect-ratio:16/7}
  .dates{grid-template-columns:1fr 1fr}.dates .n{grid-column:1/-1;grid-row:2;border:0;border-top:1px solid var(--line);padding-top:8px;display:flex;gap:6px;justify-content:center;align-items:baseline}
  .dates .n b{display:inline;font-size:1rem}
}
</style>
</head>
<body class="guest">
<header class="gbar"><div class="in"><span class="mk"><img src="/assets/logo-mark.png" alt=""></span><div><b id="hName">Hotel Portal Norte 170</b><small>HOTEL · COLIVING · BOGOTÁ</small></div></div></header>
<main class="gwrap" id="app"><div class="big-state">Cargando tu reserva…</div></main>
<div id="modalRoot"></div>
<script src="/assets/common.js"></script>
<script src="/assets/pdf.js"></script>
<script src="/assets/docs.js"></script>
<script src="/assets/sign.js"></script>
<script src="/assets/reserva.js"></script>
</body>
</html>
